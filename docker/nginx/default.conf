limit_req_zone $binary_remote_addr zone=snc5_limit:10m rate=15r/s;
limit_req_status 429;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 4;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    text/xml
    application/xml
    application/rss+xml
    image/svg+xml;

server {
    listen 80;
    server_name swatantracreativeevent.satcloud.tech;
    root /var/www/public;

    # Docker embedded DNS — re-resolve "app" tiap request, jangan cache IP lama
    # saat container app direcreate (hindari 502 setelah deploy/rebuild)
    resolver 127.0.0.11 valid=10s;
    set $upstream_app app:9000;

    index index.php index.html;

    charset utf-8;
    client_max_body_size 50M;

    # Diakses lewat Cloudflare Tunnel (cloudflared) di localhost, bukan langsung dari internet
    set_real_ip_from 0.0.0.0/0;
    real_ip_header CF-Connecting-IP;

    location ^~ /storage/ {
        include fastcgi_params;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=snc5_limit burst=30 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
